# Purpose: Define root Python tooling metadata for the API workspace.
[project]
name = "ai-harness-lab-api-workspace"
version = "0.1.0"
description = "Root Python metadata for API tooling"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "pydantic>=2.7.0",
  "uvicorn>=0.30.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
